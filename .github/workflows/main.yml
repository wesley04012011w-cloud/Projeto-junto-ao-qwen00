name: Build Android APK from ZIP (ExecuTorch On-Device AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name:  Clonar repositório
        uses: actions/checkout@v4

      - name: 📦 Extrair arquivo ZIP do projeto
        id: extract_zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Nenhum arquivo .zip encontrado no repositório!"
            exit 1
          fi
          
          echo "📦 Arquivo ZIP encontrado: $ZIP_FILE"
          mkdir -p /tmp/extracted_project
          unzip -q "$ZIP_FILE" -d /tmp/extracted_project
          
          PKG_PATH=$(find /tmp/extracted_project -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "❌ package.json não encontrado dentro do arquivo .zip!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$PKG_PATH")
          echo "📁 Raiz do projeto extraído: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Android NDK e CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name:  Instalar dependências do projeto
        working-directory: ${{ steps.extract_zip.outputs.project_root }}
        run: |
          # Usa npm ci para instalação determinística (ignora yarn.lock)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          
          # Limpa cache do Metro para evitar bundles corrompidos
          rm -rf node_modules/.cache
          rm -rf .expo

      - name: ✅ Verificar versão do react-native-svg
        working-directory: ${{ steps.extract_zip.outputs.project_root }}
        run: |
          SVG_VERSION=$(node -p "require('./node_modules/react-native-svg/package.json').version")
          echo "Versão instalada do react-native-svg: $SVG_VERSION"
          if [ "$SVG_VERSION" != "15.8.0" ]; then
            echo "⚠️ AVISO: Versão esperada é 15.8.0, mas foi instalada $SVG_VERSION"
            echo "Forçando reinstalação da versão correta..."
            npm install react-native-svg@15.8.0 --legacy-peer-deps
          fi

      - name: ⚙️ Configurar permissões do Gradle
        working-directory: ${{ steps.extract_zip.outputs.project_root }}
        run: chmod +x android/gradlew

      - name: 🧹 Limpar cache do Gradle
        working-directory: ${{ steps.extract_zip.outputs.project_root }}/android
        run: ./gradlew clean

      - name: 🚀 Compilar APK (Release)
        working-directory: ${{ steps.extract_zip.outputs.project_root }}/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError"

      - name: 🔍 Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find /tmp/extracted_project -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Nenhum APK encontrado!"
            exit 1
          fi
          echo "APK gerado com sucesso em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Fazer upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ondevice-ai-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
